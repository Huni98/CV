<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="academicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" rx="16" fill="url(#academicGrad)"/>
  
  <!-- Subtle decorative geometry -->
  <circle cx="500" cy="80" r="130" fill="rgba(45,212,191,0.1)"/>
  <circle cx="80" cy="340" r="110" fill="rgba(20,184,166,0.1)"/>
  
  <g transform="translate(60, 45)">
    <rect width="480" height="310" rx="20" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- Window bar -->
    <circle cx="35" cy="30" r="6" fill="#ef4444"/>
    <circle cx="55" cy="30" r="6" fill="#f59e0b"/>
    <circle cx="75" cy="30" r="6" fill="#10b981"/>
    <text x="240" y="35" fill="#ccfbf1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🎓 UMFST G.E. Palade - Informatika &amp; Algoritmusok</text>
    
    <!-- Content inside -->
    <g transform="translate(35, 60)">
      <rect width="410" height="85" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="30" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">WEBFEJLESZTÉS &amp; SZOFTVERTECHNOLÓGIA</text>
      <text x="20" y="55" fill="#f0fdfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Adatstruktúrák, Algoritmusok, Objektumorientált Programozás</text>
      <text x="20" y="75" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">C++, Java, Python, Webes kliens-szerver architektúrák</text>
    </g>
    
    <g transform="translate(35, 160)">
      <rect width="195" height="120" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="30" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Adatbázisok</text>
      <text x="20" y="55" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• SQL &amp; Relációs modellek</text>
      <text x="20" y="78" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Normalizálás, Tranzakciók</text>
      <text x="20" y="101" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• NoSQL &amp; Firebase integráció</text>
    </g>
    
    <g transform="translate(250, 160)">
      <rect width="195" height="120" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="30" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Hálózati Rendszerek</text>
      <text x="20" y="55" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• TCP/IP, HTTP/HTTPS</text>
      <text x="20" y="78" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• RESTful API-k fejlesztése</text>
      <text x="20" y="101" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Git verziókezelés, GitHub CI</text>
    </g>
  </g>
</svg>