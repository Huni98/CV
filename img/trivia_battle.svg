<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="triviaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" rx="16" fill="url(#triviaGrad)"/>
  
  <!-- Subtle pattern -->
  <circle cx="100" cy="80" r="120" fill="rgba(236,72,153,0.15)"/>
  <circle cx="520" cy="320" r="140" fill="rgba(99,102,241,0.15)"/>
  
  <!-- Trivia Game UI Window -->
  <g transform="translate(60, 45)">
    <rect width="480" height="310" rx="20" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- Header -->
    <circle cx="35" cy="30" r="6" fill="#ef4444"/>
    <circle cx="55" cy="30" r="6" fill="#f59e0b"/>
    <circle cx="75" cy="30" r="6" fill="#10b981"/>
    <text x="240" y="35" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚔️ Trivia Battle - React 19 &amp; Framer Motion</text>
    
    <!-- Question Box -->
    <rect x="35" y="60" width="410" height="70" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
    <text x="50" y="88" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">KÉRDÉS 4 / 10 • Kategória: Sci-Fi &amp; Pop-Kultúra</text>
    <text x="50" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Melyik bolygóról származik Luke Skywalker?</text>
    
    <!-- Answers Grid -->
    <!-- Answer 1 -->
    <g transform="translate(35, 145)">
      <rect width="195" height="48" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="20" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">A) Coruscant</text>
    </g>
    <!-- Answer 2 (Correct Highlighted) -->
    <g transform="translate(250, 145)">
      <rect width="195" height="48" rx="10" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="29" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">B) Tatooine ✓</text>
    </g>
    <!-- Answer 3 -->
    <g transform="translate(35, 205)">
      <rect width="195" height="48" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="20" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">C) Naboo</text>
    </g>
    <!-- Answer 4 -->
    <g transform="translate(250, 205)">
      <rect width="195" height="48" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="20" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">D) Hoth</text>
    </g>
    
    <!-- Score & Controls -->
    <rect x="35" y="265" width="220" height="28" rx="6" fill="rgba(255,255,255,0.05)"/>
    <text x="45" y="284" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">🏆 Pontszám: 850 XP</text>
    <text x="180" y="284" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">🔥 Streak: x3</text>
    
    <rect x="310" y="262" width="135" height="34" rx="17" fill="url(#btnGrad)"/>
    <text x="377" y="284" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Következő →</text>
  </g>
</svg>