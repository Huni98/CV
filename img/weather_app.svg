<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="weatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="600" height="400" rx="16" fill="url(#weatherGrad)"/>
  
  <!-- Subtle Grid lines -->
  <path d="M0 80 H600 M0 160 H600 M0 240 H600 M0 320 H600" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M120 0 V400 M240 0 V400 M360 0 V400 M480 0 V400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- Weather App Card UI -->
  <g transform="translate(60, 50)">
    <!-- App Container -->
    <rect width="480" height="300" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    
    <!-- Header -->
    <circle cx="35" cy="35" r="6" fill="#ef4444"/>
    <circle cx="55" cy="35" r="6" fill="#f59e0b"/>
    <circle cx="75" cy="35" r="6" fill="#10b981"/>
    <text x="240" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" opacity="0.9">Weather App - React &amp; Firebase</text>
    
    <!-- Sun & Cloud Graphic -->
    <circle cx="150" cy="140" r="42" fill="url(#sunGrad)" filter="url(#glow)"/>
    <path d="M150 170 h70 a24 24 0 0 0 0 -48 a30 30 0 0 0 -58 -10 a20 20 0 0 0 -32 20 a24 24 0 0 0 20 38 z" fill="#ffffff" opacity="0.92"/>
    
    <!-- Weather Data -->
    <text x="310" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700">24°C</text>
    <text x="310" y="160" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Târgu Mureș • Napos idő</text>
    <text x="310" y="185" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Páratartalom: 48% | Szél: 12 km/h</text>
    
    <!-- Mini Forecast Badges -->
    <g transform="translate(40, 220)">
      <rect width="115" height="52" rx="10" fill="rgba(255,255,255,0.15)"/>
      <text x="57" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Hétfő</text>
      <text x="57" y="42" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">23°C ☀️</text>
    </g>
    <g transform="translate(182, 220)">
      <rect width="115" height="52" rx="10" fill="rgba(255,255,255,0.15)"/>
      <text x="57" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Kedd</text>
      <text x="57" y="42" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">21°C ⛅</text>
    </g>
    <g transform="translate(325, 220)">
      <rect width="115" height="52" rx="10" fill="rgba(255,255,255,0.15)"/>
      <text x="57" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Szerda</text>
      <text x="57" y="42" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">19°C 🌧️</text>
    </g>
  </g>
</svg>